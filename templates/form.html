<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Зарплатный справочник на базе HH</title>
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    </head>
    <body class="bg-light">
        <!-- Navigation -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-danger sticky-top py-3">
            <div class="container px-4 px-lg-5">
                <a class="navbar-brand" href="#page-top">HH Salary Parser</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarResponsive">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Главная</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('form') }}">Поиск</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('results') }}">Результаты</a></li>                        
                        <li class="nav-item"><a class="nav-link text-light" href="#contact">Контакты</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="container mt-5">
            <h1 class="text-danger text-center mb-4">Получить аналитику по профессии</h1>
            <p>Введите название профессии или ключевое слово:</p>
            <form id="searchForm" action="{{ url_for('results') }}" method="post" class="p-4 bg-white rounded shadow-sm">
                <!-- Text Input -->
                <div class="mb-3">
                    <label for="searchQuery" class="form-label">Название профессии:</label>
                    <input type="text" id="searchQuery" name="queryString" class="form-control" placeholder="ML" required>
                </div>
                <!-- Select Dropdown -->
                <div class="mb-3">
                    <label for="role" class="form-label">Профессиональная роль:</label>
                    <select id="role" name="professionalRole" class="form-select">
                        {% for role_value, role_label in roles_dict.items() %}
                        <option value="{{ role_value }}">{{ role_label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <!-- Multiple Select for cities -->
                <div class="mb-3">
                    <label for="cities">Выберите города (без выбора - все):</label>
                    <select id="cities" name="areas" multiple class="form-select">
                        {% for city_value, city_label in cities_dict.items() %}
                        <option value="{{ city_value }}">{{ city_label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-danger mx-auto d-block" style="width: 50%;">Получить данные</button>
            </form>
            <blockquote class="blockquote text-center mt-4">
                <p class="mb-0 fst-italic">{{proverb}}</p>
                <footer class="blockquote-footer mt-2">Народная мудрость</footer>
            </blockquote>
            <a href="index.html" class="btn btn-outline-danger d-block mx-auto mt-3" style="width: fit-content;">На главную</a>
        </div>

        <!-- Блок загрузки -->
        <div id="loading" style="display: none;">
            <h3>Обработка запроса...</h3>
            <div class="spinner-border text-danger" role="status"></div>
        </div>

        <!-- Footer -->
        <footer class="bg-danger text-light py-4 mt-5">
            <div class="container px-4 px-lg-5 text-center">
                <small>&copy; 2023 - Company Name</small>
            </div>
        </footer>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Подключение скрипта загрузки -->
        <script src="{{ url_for('static', filename='js/form_handler.js') }}"></script>
    </body>
</html>
