<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Зарплатный справочник на базе HH</title>
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    </head>
    <body class="bg-light">
        <!-- Navigation -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-danger sticky-top py-3">
            <div class="container px-4 px-lg-5">
                <a class="navbar-brand" href="#page-top">HH Salary Parser</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarResponsive">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link text-light" href="index.html">Главная</a></li>
                        <li class="nav-item"><a class="nav-link text-light" href="form.html">Поиск</a></li>
                        <li class="nav-item"><a class="nav-link text-light" href="results.html">Результаты</a></li>
                        <li class="nav-item"><a class="nav-link text-light" href="#contact">Контакты</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="container mt-5">
            <h1 class="text-danger text-center mb-4">Статистика по вакансиям</h1>
            <p>Введите название профессии или ключевое слово:</p>
            <form action="results.html" method="get" class="p-4 bg-white rounded shadow-sm">
                <!-- Text Input -->
                <div class="mb-3">
                    <label for="searchQuery" class="form-label">Название профессии:</label>
                    <input type="text" id="searchQuery" name="queryString" class="form-control" placeholder="ML" required>
                </div>
                <!-- Select Dropdown -->
                <div class="mb-3">
                    <label for="role" class="form-label">Профессиональная роль:</label>
                    <select id="role" name="professionalRole" class="form-select">
                        <option value="developer">Разработчик</option>
                        <option value="dataScientist">Data scientist</option>
                        <option value="teamLead">Тимлид</option>
                        <option value="tester">Тестировщик</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="cities">Выберите города: (без выбора ищем по всем)</label>
                    <select id="cities" name="areas" multiple class="form-select">
                        <option value="1">Москва</option>
                        <option value="2">Санкт-Петербург</option>
                        <option value="1202">Новосибирск</option>
                        <option value="1261">Екатеринбург</option>
                        <option value="1438">Казань</option>
                        <option value="1042">Нижний Новгород</option>
                        <option value="1043">Челябинск</option>
                        <option value="1428">Самара</option>
                        <option value="1424">Омск</option>
                        <option value="1530">Ростов-на-Дону</option>
                        <option value="1384">Уфа</option>
                        <option value="1304">Красноярск</option>
                        <option value="1368">Пермь</option>
                        <option value="1376">Воронеж</option>
                        <option value="1216">Волгоград</option>
                        <option value="others">Прочие</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-danger mx-auto d-block" style="width: 50%;">Получить данные</button>
            </form>
            <blockquote class="blockquote text-center mt-4">
                <p class="mb-0 fst-italic">"Как потопаешь, так и полопаешь"</p>
                <footer class="blockquote-footer mt-2">Народная мудрость</footer>
            </blockquote>
            <a href="index.html" class="btn btn-outline-danger d-block mx-auto mt-3" style="width: fit-content;">На главную</a>
        </div>

        <!-- Footer -->
        <footer class="bg-danger text-light py-4 mt-5">
            <div class="container px-4 px-lg-5 text-center">
                <small>&copy; 2023 - Company Name</small>
            </div>
        </footer>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
